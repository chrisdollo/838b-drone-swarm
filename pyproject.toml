[project]
name = "project-drone-swarm"
version = "0.1.0"
description = "Decentralized swarm shape formation via differentiable simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "torch>=2.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]   # so tests can `import swarm` from the repo root
testpaths = ["tests"]
